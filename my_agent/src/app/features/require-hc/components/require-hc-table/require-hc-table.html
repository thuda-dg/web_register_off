<div class="max-h-[650px] overflow-auto rounded-lg border border-slate-200">
  <table class="w-full min-w-[900px] border-collapse bg-white text-sm">
    <thead>
      <tr class="bg-emerald-700 text-white">
        <th class="sticky top-0 bg-emerald-700 px-3 py-3 text-left">
          Kỳ lương
        </th>

        <th class="sticky top-0 bg-emerald-700 px-3 py-3 text-left">
          Ngày
        </th>

        <th class="sticky top-0 bg-emerald-700 px-3 py-3 text-left">
          Thứ
        </th>

        <th class="sticky top-0 bg-emerald-700 px-3 py-3 text-left">
          Task
        </th>

        <th class="sticky top-0 bg-emerald-700 px-3 py-3 text-left">
          Team
        </th>

        <th class="sticky top-0 bg-emerald-700 px-3 py-3 text-center">
          OFF tối đa
        </th>

        <th class="sticky top-0 bg-emerald-700 px-3 py-3 text-center">
          Đã đăng ký
        </th>

        <th class="sticky top-0 bg-emerald-700 px-3 py-3 text-center">
          Slot còn lại
        </th>

        <th class="sticky top-0 bg-emerald-700 px-3 py-3 text-center">
          Trạng thái
        </th>
      </tr>
    </thead>

    <tbody>
      @for (row of rows; track row.id) {
        <tr
          class="border-b border-slate-200 transition hover:bg-emerald-50/50"
          [class.bg-red-50]="row.full"
        >
          <td class="whitespace-nowrap px-3 py-3">
            Kỳ {{ row.cycleLabel }}
          </td>

          <td class="whitespace-nowrap px-3 py-3">
            {{ row.dateVN }}
          </td>

          <td class="px-3 py-3">
            {{ row.dayName }}
          </td>

          <td class="px-3 py-3 font-medium">
            {{ row.task }}
          </td>

          <td class="px-3 py-3">
            {{ row.team }}
          </td>

          <td class="px-3 py-3 text-center">
            {{ row.maxOff }}
          </td>

          <td class="px-3 py-3 text-center">
            {{ row.registeredOff }}
          </td>

          <td class="px-3 py-3 text-center">
            <span
              class="inline-flex min-w-12 justify-center rounded-full px-3 py-1 text-xs font-bold"
              [class]="getRemainingSlotClasses(row)"
            >
              {{ row.remainingSlot }}
            </span>
          </td>

          <td class="px-3 py-3 text-center">
            <span
              class="inline-flex min-w-20 justify-center rounded-full px-3 py-1 text-xs font-bold"
              [class.bg-red-100]="row.full"
              [class.text-red-800]="row.full"
              [class.bg-emerald-100]="!row.full"
              [class.text-emerald-800]="!row.full"
            >
              {{ getStatusText(row) }}
            </span>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
