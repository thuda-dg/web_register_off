<div class="mb-4 grid grid-cols-2 gap-3 lg:grid-cols-4">
  <article class="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3">
    <strong class="block text-xl text-emerald-700">
      {{ summary.totalDays }}
    </strong>

    <span class="mt-1 block text-xs text-slate-500">
      Tổng dòng dữ liệu
    </span>
  </article>

  <article class="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3">
    <strong class="block text-xl text-red-600">
      {{ summary.fullDays }}
    </strong>

    <span class="mt-1 block text-xs text-slate-500">
      Ngày đã đủ slot
    </span>
  </article>

  <article class="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3">
    <strong class="block text-xl text-emerald-700">
      {{ summary.availableDays }}
    </strong>

    <span class="mt-1 block text-xs text-slate-500">
      Ngày còn slot
    </span>
  </article>

  <article class="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3">
    <strong class="block text-xl text-orange-600">
      {{ summary.remainingSlots }}
    </strong>

    <span class="mt-1 block text-xs text-slate-500">
      Tổng slot còn lại
    </span>
  </article>
</div>
