<div class="space-y-2">
  <article *ngFor="let date of selectedDates" class="rounded-lg bg-slate-100 p-3">
    <div class="grid items-center gap-2 sm:grid-cols-[1fr_180px_auto]">
      <strong class="text-sm">{{ fmt(date) }}</strong>

      <select
        class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-emerald-500"
        [(ngModel)]="entries[date].type"
        (ngModelChange)="typeChanged.emit(date)"
      >
        <option value="">— Loại nghỉ —</option>
        <option *ngFor="let type of leaveTypes" [value]="type.value">{{ type.label }}</option>
      </select>

      <button
        type="button"
        class="rounded-lg px-3 py-2 text-xs font-semibold text-red-600 hover:bg-red-50"
        (click)="dateRemoved.emit(date)"
      >
        Xóa
      </button>
    </div>

    <div class="mt-2">
      <select
        class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-emerald-500"
        [(ngModel)]="entries[date].reason"
      >
        <option value="">— Chọn lý do {{ needsReason(entries[date].type) ? '(bắt buộc)' : '(nếu có)' }} —</option>
        <option *ngFor="let reason of reasonsFor(entries[date].type)" [value]="reason">{{ reason }}</option>
      </select>
    </div>
  </article>
</div>
