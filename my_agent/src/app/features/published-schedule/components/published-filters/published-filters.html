<div class="mb-4 grid grid-cols-1 gap-3 md:grid-cols-3">
  <label>
    <span class="mb-1 block text-xs font-semibold text-slate-500">
      Kỳ lương
    </span>

    <select
      class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm"
      [ngModel]="value.cycle"
      (ngModelChange)="updateFilter('cycle', $event)"
    >
      <option value="">Tất cả kỳ</option>

      @for (cycle of options.cycles; track cycle.value) {
        <option [value]="cycle.value">
          Kỳ {{ cycle.label }}
        </option>
      }
    </select>
  </label>

  <label>
    <span class="mb-1 block text-xs font-semibold text-slate-500">
      Team
    </span>

    <select
      class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm"
      [ngModel]="value.team"
      (ngModelChange)="updateFilter('team', $event)"
    >
      <option value="">Tất cả team</option>

      @for (team of options.teams; track team) {
        <option [value]="team">
          {{ team }}
        </option>
      }
    </select>
  </label>

  <label>
    <span class="mb-1 block text-xs font-semibold text-slate-500">
      Loại nghỉ
    </span>

    <select
      class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm"
      [ngModel]="value.type"
      (ngModelChange)="updateFilter('type', $event)"
    >
      <option value="">Tất cả loại</option>

      @for (type of options.types; track type) {
        <option [value]="type">
          {{ type }}
        </option>
      }
    </select>
  </label>
</div>
