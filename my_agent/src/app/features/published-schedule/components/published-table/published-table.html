<div class="max-h-[650px] overflow-auto rounded-lg border border-slate-200">
  <table class="w-full min-w-[900px] border-collapse bg-white text-sm">
    <thead>
      <tr class="bg-emerald-700 text-left text-white">
        <th class="sticky top-0 bg-emerald-700 px-3 py-3">
          Kỳ lương
        </th>

        <th class="sticky top-0 bg-emerald-700 px-3 py-3">
          Team
        </th>

        <th class="sticky top-0 bg-emerald-700 px-3 py-3">
          Nhân viên
        </th>

        <th class="sticky top-0 bg-emerald-700 px-3 py-3">
          Mã NV
        </th>

        <th class="sticky top-0 bg-emerald-700 px-3 py-3">
          Ngày nghỉ
        </th>

        <th class="sticky top-0 bg-emerald-700 px-3 py-3 text-center">
          Loại
        </th>

        <th class="sticky top-0 bg-emerald-700 px-3 py-3">
          Lí do
        </th>

        <th class="sticky top-0 bg-emerald-700 px-3 py-3">
          Public lúc
        </th>
      </tr>
    </thead>

    <tbody>
      @for (row of rows; track row.id) {
        <tr class="border-b border-slate-200 hover:bg-emerald-50/50">
          <td class="whitespace-nowrap px-3 py-3">
            Kỳ {{ row.cycleLabel }}
          </td>

          <td class="px-3 py-3">
            {{ row.team }}
          </td>

          <td class="px-3 py-3 font-medium">
            {{ row.employeeName }}
          </td>

          <td class="px-3 py-3">
            {{ row.employeeId }}
          </td>

          <td class="whitespace-nowrap px-3 py-3">
            {{ row.dateVN }}
          </td>

          <td class="px-3 py-3 text-center">
            <span
              class="inline-flex min-w-12 justify-center rounded-full px-3 py-1 text-xs font-bold"
              [class]="getTypeClasses(row.type)"
            >
              {{ row.type }}
            </span>
          </td>

          <td class="px-3 py-3">
            {{ row.reason || '—' }}
          </td>

          <td class="whitespace-nowrap px-3 py-3">
            {{ row.publishedAt || '—' }}
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
