<main class="min-h-screen bg-slate-100 px-4 py-5 text-slate-800">
  <div class="mx-auto max-w-6xl">

    <header class="mb-5 rounded-xl bg-emerald-700 px-6 py-4 text-white shadow-sm">
      <h1 class="text-lg font-bold">
        Đăng ký lịch nghỉ – WFM Off Schedule
      </h1>

      <p class="mt-1 text-xs text-white/85">
        Hệ thống quản lý lịch nghỉ WFM
      </p>
    </header>

    
    <nav class="mb-5 flex gap-2 overflow-x-auto">
      <button
        type="button"
        class="whitespace-nowrap rounded-lg border px-4 py-2 text-sm font-bold transition"
        [ngClass]="
          activeTab === 'schedule'
            ? 'border-emerald-700 bg-emerald-700 text-white'
            : 'border-slate-300 bg-white text-slate-700'
        "
        (click)="switchTab('schedule')"
      >
        Đăng ký lịch
      </button>

      <button
        type="button"
        class="whitespace-nowrap rounded-lg border px-4 py-2 text-sm font-bold transition"
        [ngClass]="
          activeTab === 'history'
            ? 'border-emerald-700 bg-emerald-700 text-white'
            : 'border-slate-300 bg-white text-slate-700'
        "
        (click)="switchTab('history')"
      >
        Lịch sử của tôi
      </button>

      <button
        type="button"
        class="whitespace-nowrap rounded-lg border px-4 py-2 text-sm font-bold transition"
        [ngClass]="
          activeTab === 'public'
            ? 'border-emerald-700 bg-emerald-700 text-white'
            : 'border-slate-300 bg-white text-slate-700'
        "
        (click)="switchTab('public')"
      >
        Lịch nghỉ đã chốt
      </button>

      <button
        type="button"
        class="whitespace-nowrap rounded-lg border px-4 py-2 text-sm font-bold transition"
        [ngClass]="
          activeTab === 'require'
            ? 'border-emerald-700 bg-emerald-700 text-white'
            : 'border-slate-300 bg-white text-slate-700'
        "
        (click)="switchTab('require')"
      >
        RequireHC
      </button>

    </nav>

    <app-schedule
      *ngIf="activeTab === 'schedule'"
    />

    <app-history
      *ngIf="activeTab === 'history'"
    />

    <app-published-schedule
      *ngIf="activeTab === 'public'"
    />

    <app-require-hc
      *ngIf="activeTab === 'require'"
    />


  </div>
</main>
